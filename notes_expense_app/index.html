<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#000000">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <meta name="apple-mobile-web-app-title" content="Expenses">
  <meta name="description" content="A private, offline-first personal expense list.">
  <link rel="manifest" href="./manifest.webmanifest">
  <link rel="apple-touch-icon" href="./icons/icon-192.png">
  <link rel="stylesheet" href="./styles.css">
  <title>Expenses</title>
</head>
<body>
  <main class="app-shell">
    <header class="topbar">
      <div class="brand">Expenses</div>
      <button id="menuButton" class="icon-button" aria-label="Open settings" title="Settings">•••</button>
    </header>

    <section class="summary" aria-live="polite">
      <div class="summary-month" id="summaryMonth">October 2026</div>
      <div class="summary-total" id="summaryTotal">₹430</div>
    </section>

    <div id="status" class="status" role="status"></div>
    <section id="notesList" class="notes-list" aria-label="Monthly expenses">
      <div id="loading" class="loading">Loading…</div>
    </section>

    <footer class="footer">
      <span id="storageStatus">Saved on this device</span>
      <button id="backupButton" class="text-button">Export backup</button>
    </footer>
  </main>

  <dialog id="settingsDialog">
    <form method="dialog" class="dialog-head">
      <div><h2>Settings</h2></div>
      <button class="icon-button" aria-label="Close settings">×</button>
    </form>
    <div class="setting-row">
      <label for="autopayInput">Monthly autopay (₹)</label>
      <input id="autopayInput" type="number" min="0" step="1" inputmode="decimal" value="430">
    </div>
    <p class="setting-help">Included in every month’s total.</p>
    <div class="dialog-actions">
      <button id="saveSettings" type="button" class="primary-button">Save</button>
      <button id="restoreButton" type="button" class="secondary-button">Import backup</button>
    </div>
    <input id="importFile" type="file" accept="application/json,.json" hidden>
    <p class="setting-help warning">Export a backup occasionally. Clearing Safari website data can erase local records.</p>
  </dialog>

  <dialog id="editDialog">
    <form method="dialog" class="dialog-head">
      <div><h2>Edit expense</h2></div>
      <button class="icon-button" aria-label="Close editor">×</button>
    </form>
    <input id="editId" type="hidden">
    <label class="field-label" for="editTitle">Description</label>
    <input id="editTitle" class="dialog-input" type="text">
    <label class="field-label" for="editAmount">Amount (₹)</label>
    <input id="editAmount" class="dialog-input" type="number" min="0" step="0.01" inputmode="decimal">
    <label class="field-label" for="editDate">Date</label>
    <input id="editDate" class="dialog-input" type="date">
    <div class="dialog-actions">
      <button id="saveEdit" type="button" class="primary-button">Save</button>
      <button id="deleteExpense" type="button" class="danger-button">Delete</button>
    </div>
  </dialog>

  <script src="./app.js"></script>
</body>
</html>
